      <stop offset="0%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
