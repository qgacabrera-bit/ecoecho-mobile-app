services:
  - type: web
    name: ecoecho-ai-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python ai_server.py
    envVars:
      - key: PORT
        value: 10000
      - key: CAMERA_SOURCE
        value: esp32
      - key: CONFIDENCE_THRESHOLD
        value: 0.70
